run:
  name: nigeria_consistent_P1
countries:
- NG
scenario:
  simpl:
  - ''
  ll:
  - copt
  clusters:
  - 10
  opts:
  - 1h
snapshots:
  start: '2024-01-01'
  end: '2025-01-01'
  inclusive: left
enable:
  retrieve_databundle: false
  download_osm_data: true
  retrieve_cutout: false
  build_cutout: false
  retrieve_cost_data: false
  retrieve_databundle_sector: false
  download_global_buildings: false
  build_natura_raster: true
  progress_bar: true
atlite:
  nprocesses: 4
  cutouts:
    cutout-2024-era5:
      module: era5
      dx: 0.3
      dy: 0.3
      time:
      - '2024-01-01'
      - '2025-01-01'
  default: cutout-2024-era5
renewable:
  onwind:
    cutout: auto
    resource:
      method: wind
      turbine: Vestas_V112_3MW
    capacity_per_sqkm: 3
    copernicus:
      grid_codes:
      - 20
      - 30
      - 40
      - 60
      - 100
      - 111
      - 112
      - 113
      - 114
      - 115
      - 116
      - 121
      - 122
      - 123
      - 124
      - 125
      - 126
      distance: 1000
      distance_grid_codes:
      - 50
    natura: true
    potential: simple
    clip_p_max_pu: 0.01
    extendable: true
  solar:
    cutout: auto
    resource:
      method: pv
      panel: CSi
      orientation: latitude_optimal
    capacity_per_sqkm: 4.6
    correction_factor: 1.0
    copernicus:
      grid_codes:
      - 20
      - 30
      - 40
      - 50
      - 60
      - 90
      - 100
    natura: true
    potential: simple
    clip_p_max_pu: 0.01
    extendable: true
  hydro:
    cutout: auto
    hydrobasins_level: 6
    resource:
      method: hydro
      hydrobasins: data/hydrobasins/hybas_world.shp
      flowspeed: 1.0
    carriers:
    - ror
    - hydro
    - PHS
    hydro_max_hours: energy_capacity_totals_by_country
    hydro_max_hours_default: 6.0
    clip_min_inflow: 1.0
    extendable: false
    normalization:
      method: eia
      year: 2023
    multiplier: 1.268
    hydro_min_inflow_pu: 1.0
conventional:
  CCGT:
    p_max_pu: 0.306
  OCGT:
    p_max_pu: 0.217
clustering:
  exclude_carriers:
  - oil
  - gas
  - coal
  remove_stubs: true
  p_threshold_drop_isolated: 100
base_network:
  min_voltage_rebase_voltage: 330000
load_options:
  source: demcast
  weather_year: 2024
  prediction_year: 2030
  scale: 1.0
electricity:
  base_voltage: 330.0
  voltages:
  - 132.0
  - 330.0
  renewable_carriers:
  - solar
  - onwind
  - hydro
  conventional_carriers:
  - oil
  - OCGT
  - CCGT
  - biomass
  extendable_carriers:
    Generator:
    - solar
    - onwind
    - OCGT
    - CCGT
    StorageUnit:
    - battery
    Store: []
  max_hours:
    battery: 6
  powerplants_filter: (DateOut >= 2030 or DateOut != DateOut) and (DateIn <= 2030
    or DateIn != DateIn)
  custom_powerplants: replace
  estimate_renewable_capacities:
    stats: irena
    year: 2023
  split_existing: true
lines:
  s_max_pu: 1.0
  custom_line_types: data/line_types.csv
  ac_types:
    330.0: ACSR Zebra 2-bundle 330.0
costs:
  year: 2030
  discountrate:
  - 0.07843137254901977
  discountrate_groups:
    renewable:
